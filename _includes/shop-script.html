{% if site.products.size > 0 %}
    {%- comment -%} Everything the cart needs, one entry per item for sale. A product without `skus` is one item keyed by its handle. {%- endcomment -%}
    <script id="shop-config" type="application/json">{"api":{{ site.shop_api | jsonify }},"items":[{% assign sep = "" %}{% for p in site.products %}{% if p.skus %}{% assign skus = p.skus %}{% else %}{% assign skus = nil %}{% endif %}{% if skus %}{% for s in skus %}{% assign price = s.price | default: p.price %}{{ sep }}{"key":{{ s.key | jsonify }},"handle":{{ p.handle | jsonify }},"product":{{ p.title | jsonify }},"name":{{ s.name | jsonify }},"price":{% if price != "" and price %}{{ price }}{% else %}null{% endif %},"shipped":{% if p.kind == "digital" %}false{% else %}true{% endif %},"url":{{ p.url | jsonify }}}{% assign sep = "," %}{% endfor %}{% else %}{{ sep }}{"key":{{ p.handle | jsonify }},"handle":{{ p.handle | jsonify }},"product":{{ p.title | jsonify }},"name":"","price":{% if p.price != "" and p.price %}{{ p.price }}{% else %}null{% endif %},"shipped":{% if p.kind == "digital" %}false{% else %}true{% endif %},"url":{{ p.url | jsonify }}}{% assign sep = "," %}{% endif %}{% endfor %}]}</script>
    <script type="module" src="/assets/shop.js"></script>
    {% endif %}
